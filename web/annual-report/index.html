<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Personal Annual Report</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <aside class="panel controls" aria-label="Report controls">
          <div>
            <p class="eyebrow" data-i18n="eyebrow">Local-first</p>
            <h1 data-i18n="appTitle">Personal Annual Report</h1>
            <p class="intro" data-i18n="intro">Upload an Alipay CSV or cleaned ledger CSV. Everything runs in this browser tab.</p>
          </div>

          <label class="dropzone" for="fileInput">
            <input id="fileInput" type="file" accept=".csv,.json" />
            <span class="drop-title" data-i18n="chooseFile">Choose CSV / JSON</span>
            <small data-i18n="dropHint">Alipay CSV is supported first; cleaned ledger exports also work.</small>
          </label>

          <div class="control-group">
            <span class="control-label" data-i18n="languageLabel">Language</span>
            <div class="segmented" role="group" aria-label="Language">
              <button class="active" type="button" data-lang="en">EN</button>
              <button type="button" data-lang="zh">中文</button>
            </div>
          </div>

          <div class="control-group">
            <span class="control-label" data-i18n="toneLabel">Tone</span>
            <select id="styleSelect">
              <option value="board_roast" data-i18n="styleBoardRoast">Board Roast</option>
              <option value="serious" data-i18n="styleSerious">Serious Report</option>
              <option value="social_share" data-i18n="styleSocial">Social Share</option>
            </select>
          </div>

          <div class="actions">
            <button id="exportMarkdown" type="button" data-i18n="exportMarkdown">Markdown</button>
            <button id="exportHtml" type="button" data-i18n="exportHtml">HTML</button>
            <button id="exportPng" type="button" data-i18n="exportPng">PNG</button>
          </div>

          <div id="status" class="status" role="status">
            <span data-i18n="waiting">Waiting for a file.</span>
          </div>
        </aside>

        <section class="report-wrap" aria-live="polite">
          <article id="report" class="report">
            <div class="placeholder">
              <p class="eyebrow" data-i18n="placeholderKicker">No network. No API.</p>
              <h2 data-i18n="placeholderTitle">Your report will appear here.</h2>
              <p data-i18n="placeholderBody">Upload an Alipay CSV first; stricter multi-source reconciliation still belongs to the CLI.</p>
            </div>
          </article>
        </section>
      </section>
    </main>
    <script src="./src/app.js"></script>
  </body>
</html>
